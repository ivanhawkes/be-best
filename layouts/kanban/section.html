{{ define "main" }}
  <div class="container">
    <p>KANBAN: SECTION</p>

    {{/*  {{- partial "/components/colour-swatch.html" -}}  */}}

    <!-- If there's any content, it can go here, in it's own row. -->
    {{ with .Content }}
      <div class="prose w-full prose-neutral">
        {{ . }}
      </div>
    {{ end }}

    <div
      class="grid grid-cols-2 justify-between space-4 gap-4 sm:grid-cols-3 xl:grid-cols-4">
      {{ range .Pages }}
        {{- partial "/kanban/section-card.html" . -}}
      {{ end }}
    </div>
  </div>
{{ end }}

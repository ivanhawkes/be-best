{{ define "main" }}
  <div class="container">
    <p>KANBAN: SECTION</p>

    <!-- If there's any content, it can go here, in it's own row. -->
    {{ with .Content }}
      <section>
        {{ . }}
      </section>
    {{ end }}

    <div
      class="grid grid-cols-1 justify-between space-y-4 space-x-4 md:grid-cols-2 xl:grid-cols-3">
      {{ range .Pages }}
        {{- partial "/kanban/section-card.html" . -}}
      {{ end }}
    </div>
  </div>
{{ end }}

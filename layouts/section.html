{{ define "main" }}
  <div class="container mx-auto">
    <div>
      <div class="row">
        <!-- If there's any content, it can go here, in it's own row. -->
        {{ with .Content }}
          <div class="prose w-full prose-neutral">
            {{ . }}
          </div>
        {{ end }}


        <div
          class="grid grid-cols-1 space-y-4 space-x-4 md:grid-cols-2 xl:grid-cols-3">
          {{ range .Pages }}
            {{- partial "/posts/card.html" . -}}
          {{ end }}
        </div>
      </div>
    </div>
  </div>
{{ end }}

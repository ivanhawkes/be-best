<div class="w-52 rounded-md border bg-card p-2">
  {{ if .Params.image }}
    <div>
      <a href="{{ .Permalink }}">
        <img class="rounded-md" src="{{ .Params.image }}" />
      </a>
    </div>
  {{ end }}


  <div>
    <div class="text-lg">
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </div>
    <div class="line-clamp-4 text-sm">
      {{ .Summary }}
      <a href="{{ .Permalink }}">Read More&nbsp;>></a>
    </div>
  </div>
</div>

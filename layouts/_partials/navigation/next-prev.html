  <!-- Next / Previous. -->
  <div class="text-md flex items-center justify-between">
    <div class="text-start bg-brand-600 rounded-md">
      {{ with .PrevInSection }}
        <a class="" href="{{ .Permalink }}">
          <span>«&NonBreakingSpace;</span>
          {{ .Title | truncate 32 }}
        </a>
      {{ end }}
    </div>
    <div class="text-end bg-brand-600 rounded-md">
      {{ with .NextInSection }}
        <a href="{{ .Permalink }}">
          {{ .Title | truncate 32 }}&NonBreakingSpace;
          <span>»</span>
        </a>
      {{ end }}
    </div>
  </div>
</div>

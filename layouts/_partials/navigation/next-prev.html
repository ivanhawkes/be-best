  <!-- Next / Previous. -->
  <div class="text-md flex items-center justify-between m-4">
    <div class="text-start">
      {{ with .PrevInSection }}
        <a href="{{ .Permalink }}">
          <span>«&NonBreakingSpace;</span>
          {{ .Title | truncate 32 }}
        </a>
      {{ end }}
    </div>
    <div class="text-end">
      {{ with .NextInSection }}
        <a href="{{ .Permalink }}">
          {{ .Title | truncate 32 }}&NonBreakingSpace;
          <span>»</span>
        </a>
      {{ end }}
    </div>
  </div>
</div>

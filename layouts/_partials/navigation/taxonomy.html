<div class="text-md flex flex-col items-center justify-center mt-4">
  <ul class="navigation">
    <!-- Taxonomy - Categories. -->
    {{ range $index, $value := .Params.categories }}
      <li>
        {{ if $index }} &#9210; {{ end }}
        <a href="/categories/{{ . | urlize }}">{{- $value -}}</a>
      </li>
    {{ end }}
  </ul>

    <!-- Taxonomy - Tags. -->
  <ul class="navigation">
    {{ range $index, $value := .Params.tags }}
      <li>
        {{ if $index }} &#9210; {{ end }}
          <a href="/tags/{{ . | urlize }}">{{- $value -}}</a>
      </li>
    {{ end }}
  </ul>
</div>

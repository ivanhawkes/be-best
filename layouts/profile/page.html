{{ define "main" }}
  {{ range (where hugo.Data.profile.person "profile" .Params.profile) }}
    <div>
      {{- partial "/components/featured-image" . -}}

      <div>
        <img src="{{ .avatar }}" alt="Avatar of {{ .name }}" />
      </div>

      <div>
        <div>{{ .name }}</div>
        <div>{{ .position }}</div>

        <div>{{- partial "/social-media/social-media-small.html" . -}}</div>

        <div>&quot;{{ .description }}&quot;</div>
      </div>
    </div>
  {{ end }}

  <!-- Main Content -->
  <div class="prose w-full prose-neutral">
    <div>{{ .Content }}</div>
  </div>
{{ end }}

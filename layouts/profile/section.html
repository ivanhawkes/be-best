{{ define "main" }}
  <div class="container mx-auto">
    <div class="container mx-auto">
      <div class="row">
        <!-- If there's any content, it can go here, in it's own row. -->
        {{ with .Content }}
          <div class="prose w-full prose-neutral">
            {{ . }}
          </div>
        {{ end }}

        <div
          class="grid grid-cols-1 space-y-4 space-x-4 sm:grid-cols-2 md:grid-cols-3">
          {{ range hugo.Data.profile.person }}
            {{- partial "/components/featured-image" . -}}
            {{- partial "/profiles/card.html" . -}}
          {{ end }}
        </div>
      </div>
    </div>
  </div>
{{ end }}

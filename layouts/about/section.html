{{ define "main" }}
  <div class="container mx-auto">
    <div class="main main-raised">
      <!-- If there's any content, it can go here, in it's own row. -->
      {{ with .Content }}
        <div class="container mx-auto">
          {{ . }}
        </div>
      {{ end }}

      {{ if hugo.Data.about.corevalue }}
        <div class="row">
          <div class="col text-center">
            <div class="text-lg">{{ .Param "core-title" }}</div>
            <div class="description">
              {{ .Param "core-description" }}
            </div>
          </div>
        </div>

        <div class="row">
          {{ range hugo.Data.about.corevalue }}
            {{- partial "/about/card.html" . -}}
          {{ end }}
        </div>
      {{ end }}
    </div>
  </div>
{{ end }}

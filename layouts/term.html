{{ define "main" }}
  <h1>{{ .Title }}</h1>

  <p>ROOT: TERM</p>

  {{ .Content }}


  <div
    class="grid grid-cols-1 space-y-4 space-x-4 md:grid-cols-2 xl:grid-cols-3">
    {{ range .Pages }}
      <div class="w-52 rounded-md border bg-card p-2">
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      </div>
    {{ end }}
  </div>
{{ end }}
